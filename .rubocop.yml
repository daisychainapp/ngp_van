AllCops:
  Exclude:
    - 'Gemfile'
    - 'example.rb'
    - 'vendor/bundle/**/*'

  DisplayStyleGuide: true
  SuggestExtensions: false

  TargetRubyVersion: 3.0

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'

Style/Documentation:
  Enabled: false

Naming/FileName:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Style/NumericLiterals:
  Exclude:
    - 'spec/**/*'

Metrics/ParameterLists:
  CountKeywordArgs: false
